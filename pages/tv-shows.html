<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Shows | Cutscene</title>
    <link rel="icon" href="../assets/images/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/tv-shows.css" />
    <link rel="stylesheet" href="../assets/css/theme-toggle.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html"><img src="../assets/images/logo.png" alt="Cutscene Logo" width="50" height="50" /></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
            <li class="nav-item"><a class="nav-link active" href="tv-shows.html">TV Shows</a></li>
            <li class="nav-item"><a class="nav-link" href="library.html">Library</a></li>
          </ul>
          <form class="d-flex" role="search" id="tvSearchForm"><input class="form-control rounded-5 me-2" type="search" placeholder="Search TV shows..." aria-label="Search TV shows" id="searchInput" /></form>
          <button class="theme-toggle-btn ms-lg-3" id="themeToggle" type="button" aria-pressed="false" aria-label="Toggle light and dark mode"><span class="theme-toggle-icon theme-icon-moon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span><span class="theme-toggle-icon theme-icon-sun" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="theme-toggle-knob"></span></button>
        </div>
      </div>
    </nav>

    <section>
      <div class="container pt-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
          <h3 class="mb-0">TV Shows</h3>
          <div class="d-flex align-items-center gap-2 sort-container"><label for="sortSelect" class="mb-0">Sort by:</label><select id="sortSelect" class="form-select rounded-pill"><option value="default">Recommended</option><option value="rating-desc">Rating: High to Low</option><option value="rating-asc">Rating: Low to High</option><option value="year-desc">Year: Newest</option><option value="year-asc">Year: Oldest</option><option value="title-asc">Title: A-Z</option><option value="title-desc">Title: Z-A</option></select></div>
        </div>

        <div class="catalog-controls mb-4">
          <div class="filter-control">
            <label for="genreSelect">Categories:</label>
            <select id="genreSelect" class="form-select rounded-pill">
              <option value="all">All Categories</option>
              <option value="action">Action</option>
              <option value="drama">Drama</option>
              <option value="comedy">Comedy</option>
              <option value="adventure">Adventure</option>
              <option value="sci-fi">Sci-Fi</option>
              <option value="thriller">Thriller</option>
              <option value="crime">Crime</option>
              <option value="fantasy">Fantasy</option>
              <option value="romance">Romance</option>
              <option value="animation">Animation</option>
              <option value="anime">Anime</option>
            </select>
          </div>

          <div class="type-filter" id="typeFilter">
            <span class="language-label">Type:</span>
            <button type="button" class="filter-btn active" data-type="all">All</button>
            <button type="button" class="filter-btn" data-type="tv">TV Shows</button>
          </div>

          <div class="language-filter" id="languageFilter">
            <span class="language-label">Language:</span>
            <button type="button" class="language-btn active" data-language="all">All</button>
            <button type="button" class="language-btn" data-language="AR"><span class="language-badge ar-badge">AR</span> عربي</button>
            <button type="button" class="language-btn" data-language="EN"><span class="language-badge en-badge">E</span> English</button>
          </div>
        </div>

        <div class="row g-4" id="tvShowsContainer"></div>
        <div id="noResults" class="text-center text-muted py-5 d-none">No TV shows match your filters.</div>
      </div>
    </section>

    <footer class="custom-footer"><div class="container text-center"><p class="mb-0">All Rights Reserved © Cutscene 2026.</p></div></footer>

    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content bg-dark text-white border-secondary"><div class="modal-header border-secondary"><h5 class="modal-title" id="modalTitle">Series Details</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><div class="row"><div class="col-md-4"><img id="modalImage" src="" alt="Poster" class="img-fluid rounded" /></div><div class="col-md-8"><h3 id="modalTitleText"></h3><p><strong>Year:</strong> <span id="modalYear"></span></p><p><strong>Rating:</strong> <span id="modalRating"></span></p><p><strong>Description:</strong> <span id="modalDescription">No description available.</span></p><div id="modalImdbContainer" class="d-none mt-2"><a id="modalImdbLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline-light btn-sm">View on IMDb <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div><div id="modalWatchNowContainer" class="d-none mt-2"><a id="modalWatchNow" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-danger btn-sm watch-now-btn">▶ Watch Now</a></div><button class="btn btn-danger mt-3" id="modalAddWatchlist">+ Add to Watchlist</button><span id="modalWatchlistStatus" class="ms-3 text-success d-none">✓ In your watchlist</span></div></div></div><div class="modal-footer border-secondary"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../assets/js/tv-shows.js"></script>
    <script src="../assets/js/theme-toggle.js"></script>
  </body>
</html>
